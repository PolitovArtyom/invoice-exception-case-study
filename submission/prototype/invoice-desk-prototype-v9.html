<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Exception Desk — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--background, #fff); color: var(--foreground, #171717); font-family: var(--font-sans, Inter, system-ui, sans-serif); }
  .proto-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; font-size: 12px; color: var(--muted-foreground, #6b6b6b); border-bottom: 1px solid var(--border, #e5e5e5); }
  .proto-bar b { color: var(--foreground, #171717); font-weight: 600; }
  .proto-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-left: auto; color: var(--foreground, #171717); }

  .app {
    --ink: #1f1a10; --ink-2: #5f574a; --ink-3: #8c8371;
    --paper: #fffbea; --card: #ffffff; --line: #eee3c4; --line-2: #f5edd6;
    --sun: #ffd43b; --sun-2: #fcc419; --sun-soft: #fff3bf; --sun-deep: #e8a800;
    --ok: #1f7a4a; --ok-bg: #dcf5e6; --rev: #a3460b; --rev-bg: #ffe8d1;
    --info: #1e4fb8; --info-bg: #dde8ff; --bad: #b4231a; --bad-bg: #fde1dd; --na: #6f6a60; --na-bg: #eeebe4;
    background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45;
  }
  .app * { box-sizing: border-box; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--sun); border-bottom: 1px solid var(--sun-deep); }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--sun); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .brand { font-weight: 700; letter-spacing: -0.01em; }
  .nav a { color: var(--ink); text-decoration: none; font-weight: 500; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .nav a.active, .nav a:hover { background: rgba(31,26,16,.1); }
  .who { margin-left: auto; font-size: 12.5px; }

  .page { max-width: 1060px; margin: 0 auto; padding: 18px 20px 40px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -0.01em; }
  .section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; position: relative; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .section-head h2 { margin: 0; }
  .section-head .aside { margin-left: auto; font-size: 12.5px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .badge.lg { font-size: 14px; padding: 6px 14px; }
  .d-clear { background: var(--ok-bg); color: var(--ok); }
  .d-needs_review { background: var(--rev-bg); color: var(--rev); }
  .d-needs_information { background: var(--info-bg); color: var(--info); }
  .d-blocked { background: var(--bad-bg); color: var(--bad); }
  .d-duplicate { background: var(--na-bg); color: var(--na); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .st { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 700; flex: none; }
  .st-pass { background: var(--ok-bg); color: var(--ok); }
  .st-fail-blocked { background: var(--bad-bg); color: var(--bad); }
  .st-fail-needs_review { background: var(--rev-bg); color: var(--rev); }
  .st-unknown { background: var(--info-bg); color: var(--info); }
  .st-not_applicable { background: var(--na-bg); color: var(--na); }

  .src { display: inline-flex; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); white-space: nowrap; }
  .src-agent_proposal { background: var(--rev-bg); color: var(--rev); border-color: transparent; }
  .src-human_confirmation { background: var(--ok-bg); color: var(--ok); border-color: transparent; }

  .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--sun-deep); background: var(--sun); color: var(--ink); cursor: pointer; }
  .btn:hover { background: var(--sun-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; border-color: var(--line); font-weight: 500; }
  .btn.ghost:hover { background: var(--sun-soft); }
  .link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--sun-deep); text-underline-offset: 3px; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--sun-soft); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
  .chip.on { background: var(--ink); color: var(--sun); border-color: var(--ink); }

  .case-head { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .amount { font-size: 22px; font-weight: 700; text-align: right; }
  .scope { margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: var(--sun-soft); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .old-rev { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--info-bg); color: var(--info); font-size: 13px; }

  .issue { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line-2); }
  .issue:first-of-type { border-top: 0; }
  .issue .t { font-weight: 600; }
  .issue .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
  .issue .meta span b { font-weight: 600; }
  .waiting { margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: var(--paper); font-size: 13px; }
  .allgood { display: flex; gap: 10px; align-items: center; }

  .proposal { border: 1px dashed var(--rev); border-radius: 10px; padding: 12px 14px; background: #fffaf3; }
  .proposal.done { border: 1px solid var(--ok); background: #f6fcf8; }
  .map { display: grid; grid-template-columns: 1fr 24px 1fr; gap: 8px; align-items: center; margin: 8px 0; }
  .map .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); }
  .confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); }
  .confirm input[type=text] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 200px; background: #fff; color: var(--ink); }
  .confirm label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

  .line-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .line-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .line-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cell { background: var(--paper); border-radius: 8px; padding: 8px 10px; }
  .cell .h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 600; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .kv span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }

  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; vertical-align: 1px; }
  .tag-doc { background: #e7f0ff; color: #23498f; }
  .tag-co { background: #efe9dc; color: #5f574a; }
  .tag-calc { background: #f3e8ff; color: #6b2fa3; }
  .tag-pdf { background: var(--sun-soft); color: #7a5a00; }
  .pdf-quote { font-family: Georgia, 'Times New Roman', serif; background: #fffdf5; border: 1px solid var(--line); border-left: 3px solid var(--sun-deep); padding: 1px 6px; border-radius: 3px; display: inline-block; }
  .line-sum { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 400; list-style: none; }
  .line-sum::-webkit-details-marker { display: none; }
  .line-card > summary { cursor: pointer; }
  .line-card[open] > summary { margin-bottom: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 130px 1fr; gap: 8px; align-items: center; }
  .pair .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .pair .tag { margin-bottom: 4px; }
  .pair-mid { text-align: center; font-size: 12px; }
  .kv .tag { min-width: 58px; text-align: center; }
  .in { display: grid; grid-template-columns: 64px 1fr auto; gap: 6px; align-items: baseline; font-size: 13px; padding: 1px 0; }
  .in b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .in-src { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; text-align: center; }
  .in-doc { background: #e7f0ff; color: #23498f; }
  .in-co { background: #efe9dc; color: #5f574a; }
  .chk { margin-top: 8px; border-radius: 8px; padding: 6px 8px; border: 1px solid transparent; }
  .chk-h { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .chk-h span:not(.st) { text-transform: uppercase; letter-spacing: .05em; font-weight: 700; font-size: 10.5px; opacity: .8; }
  .chk-h b { margin-left: auto; font-size: 12.5px; }
  .chk-f { font-size: 12.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .chk-pass { background: #eefaf2; border-color: #bfe6cd; color: #14522f; }
  .chk-fail-blocked { background: #fff0ee; border-color: #f4b8b1; color: #8c1a12; }
  .chk-fail-needs_review { background: #fff4e8; border-color: #f2c79c; color: #84380a; }
  .chk-unknown { background: #eef3ff; border-color: #bccdf3; color: #1e3f8f; }
  .chk-not_applicable { background: #f3f1ec; border-color: #ddd7cb; color: #5d584f; }
  .chk-legend { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: #eefaf2; border: 1px solid #bfe6cd; color: #14522f; }
  .cell { background: #fff; border: 1px solid var(--line); }
  .stepper { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 12.5px; }
  .sp { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink-3); }
  .sp.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
  .sp.cur { background: var(--ink); color: var(--sun); border-color: var(--ink); font-weight: 600; }
  .sp.out { border-style: dashed; }
  .sp-arrow { color: var(--ink-3); }
  .sp-note { margin-left: 6px; font-size: 11.5px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .flash { font-size: 13px; padding: 4px 10px; border-radius: 6px; background: var(--info-bg); color: var(--info); }
  .accept-form { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
  .resolution { display: grid; grid-template-columns: 22px 1fr; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #eefaf2; border: 1px solid #bfe6cd; }
  .facts tr .edit-link { opacity: 0; }
  .facts tr:hover .edit-link { opacity: 1; }
  .edit-link { margin-left: 8px; font-family: Inter, sans-serif; font-size: 12px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--sun-deep); cursor: pointer; }
  .edit { display: flex; gap: 6px; flex-wrap: wrap; }
  .edit input { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; min-width: 90px; }
  .edit .btn { padding: 4px 10px; font-size: 12.5px; }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  .facts { table-layout: fixed; }
  .facts td { word-break: break-word; }
  .fact-src { font-size: 12.5px; }
  .fact-src q { quotes: "“" "”"; background: var(--sun-soft); padding: 0 3px; border-radius: 3px; }
  .missing { color: var(--info); font-size: 12px; font-weight: 600; }
  .untrusted { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--bad); background: #fff6f5; font-size: 13px; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; align-items: center; }
  .timeline li:hover { background: var(--sun-soft); }
  .timeline li.cur { background: var(--sun-soft); outline: 1px solid var(--sun-deep); }
  .rev { font-weight: 700; font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
  .actor { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }

  .req { display: none; margin: 6px 0 10px; padding: 6px 10px; border-radius: 6px; background: #fff0a6; border: 1px solid var(--sun-deep); font-size: 12px; color: #4a3b00; }
  .req b { font-weight: 700; }
  .show-req .req { display: block; }
  .idea { background: #e9f0ff; border-color: #9db5ec; color: #1e3a7a; }

  @media (max-width: 760px) {
    .line-grid, .totals, .pair { grid-template-columns: 1fr; }
    .case-head { grid-template-columns: 1fr; }
    .amount { text-align: left; }
    .hide-sm { display: none; }
  }
</style>
</head>

function badge(o, lg) { const k = outcome(o); return `<span class="badge ${lg ? 'lg' : ''} d-${k}"><span class="dot"></span>${DECISION_LABEL[k]}</span>`; }

function findOrderLine(ctx, olId) { for (const o of ctx.purchase_orders.orders) for (const l of o.lines) if (l.line_id === olId) return { order: o, line: l }; return null; }
function supplierByReg(ctx, reg) { return ctx.suppliers.suppliers.find(s => norm(s.registration_id) === norm(reg)); }
function supplierById(ctx, id) { return ctx.suppliers.suppliers.find(s => s.supplier_id === id); }
function buyerByReg(ctx, reg) { return ctx.buyers.buyers.find(b => norm(b.registration_id) === norm(reg)); }

function issueText(id, o, c) {
  const x = ext(id), ctx = contextAt(id, currentIndex(id));
  const dl = x.lines.find(l => l.line_id === c.object_id);
  const lr = o.lines.find(l => l.document_line_id === c.object_id);
  const lineName = dl ? `Line ${esc(dl.line_id)} “${esc(dl.description)}”: ` : '';
  const ol = lr && lr.order_line_id ? findOrderLine(ctx, lr.order_line_id) : null;
  if (c.status === 'unknown') {
    const q = o.questions.find(q => q.target_object_ids.includes(c.object_id) && c.depends_on == null);
    const friendly = {
      order_reference: 'Which purchase order is this invoice for? The document has no PO reference, and no single open order matches every line automatically.',
      line_match: 'Which order line does this invoice line belong to?',
      goods_receipts: 'Goods receipt data is unavailable, so received quantity cannot be checked.',
      bank_account: 'The document has no IBAN.',
      'document.currency': 'The document has no currency.',
      'supplier.registration_id': 'The document has no supplier registration ID.',
      'buyer.registration_id': 'The buyer cannot be identified from the document.',
    };
    return { title: CHECK_TITLES[c.code], body: lineName + (q ? esc(friendly[q.required_fact] || q.text) : ''), next: {
      order_reference: 'Identify the order, or ask the agent to propose one; confirm the proposal here.',
      line_match: 'Ask the agent to propose a line match; confirm it here.',
      goods_receipts: 'Restore the receipt feed and re-check.',
      bank_account: 'Request the bank details from the supplier through a known contact.',
    }[q?.required_fact] || 'Provide the missing fact and re-check.' };
  }
  switch (c.code) {
    case 'UNIT_PRICE': {
      const d = (Number(dl.unit_net_price) - Number(ol.line.unit_net_price)).toFixed(2);
      return { title: 'Unit price differs from the order', body: `${lineName}invoice ${money(dl.unit_net_price)}, order ${money(ol.line.unit_net_price)} — difference ${d}, tolerance 0.01.`, next: 'If the new price was agreed, procurement updates the order price and the invoice is re-checked. If not, request a corrected invoice from the supplier. A price cannot be approved on this page.' };
    }
    case 'QTY_RECEIVED':
      return { title: 'Invoiced more than was received', body: `${lineName}invoiced ${qty(dl.quantity)} ${esc(dl.unit)}, available to invoice ${qty(lr.available_to_invoice)} (received ${qty(lr.received)} − previously invoiced ${qty(lr.previously_invoiced)}).`, next: 'If the goods are already on site, post the goods receipt and re-check. If they were not delivered, request a corrected invoice.' };
    case 'QTY_ORDER_REMAINING':
      return { title: 'Invoiced more than is left on the order', body: `${lineName}invoiced ${qty(dl.quantity)} ${esc(dl.unit)}, left on the order ${qty(lr.remaining_on_order)} (ordered ${qty(lr.ordered)} − previously invoiced ${qty(lr.previously_invoiced)}).`, next: 'Check for an order amendment; otherwise request a corrected invoice.' };
    case 'LINE_ARITHMETIC':
      return { title: 'Line amounts do not add up', body: `${lineName}${qty(dl.quantity)} × ${money(dl.unit_net_price)} = ${money(lr.calculated_net)}, invoice says ${money(dl.declared_net_amount)}; VAT calculated ${money(lr.calculated_tax)}, invoice says ${money(dl.declared_tax_amount)}.`, next: 'Compare with the PDF quote below. If it was misread, correct the value. If the invoice itself is wrong, ask the supplier for a corrected invoice — the agent registers it as a new version.' };
    case 'TOTALS_ARITHMETIC': {
      const t = o.totals, parts = [];
      if (Number(t.calculated_subtotal) !== Number(x.declared_subtotal)) parts.push(`subtotal ${money(t.calculated_subtotal)} vs ${money(x.declared_subtotal)}`);
      if (Number(t.calculated_tax_total) !== Number(x.declared_tax_total)) parts.push(`VAT total ${money(t.calculated_tax_total)} vs ${money(x.declared_tax_total)}`);
      if (Number(t.calculated_total) !== Number(x.declared_total)) parts.push(`total ${money(t.calculated_total)} vs ${money(x.declared_total)}`);
      return { title: 'Invoice totals do not add up', body: `Calculated vs on the invoice: ${parts.join('; ')}.`, next: 'Compare with the PDF quote below. If it was misread, correct the value. If the invoice itself is wrong, ask the supplier for a corrected invoice — the agent registers it as a new version.' };
    }
    case 'BANK_ACCOUNT': {
      const s = supplierByReg(ctx, x.supplier.registration_id);
      return { title: 'IBAN is not approved for this supplier', body: `Invoice IBAN <span class="mono">${esc(x.bank.iban)}</span> is not among the approved accounts of ${esc(s?.legal_name)} (<span class="mono">${esc((s?.approved_bank_accounts || []).map(a => a.iban).join(', '))}</span>).`, next: 'Do not pay. Verify by calling the supplier on a number already on file — not from this invoice or email. Bank details cannot be approved on this page.' };
    }
    case 'SUPPLIER_IDENTITY': {
      const s = supplierByReg(ctx, x.supplier.registration_id), ord = ctx.purchase_orders.orders.find(r => r.order_id === o.matched_order_id), os = ord && supplierById(ctx, ord.supplier_id);
      return { title: 'Supplier does not match the order', body: s ? `Invoice is from ${esc(s.legal_name)} (<span class="mono">${esc(s.registration_id)}</span>), but order ${esc(ord?.reference)} belongs to ${esc(os?.legal_name)} (<span class="mono">${esc(os?.registration_id)}</span>). Similar names do not make it the same company.` : `Registration ID <span class="mono">${esc(x.supplier.registration_id)}</span> is not in the supplier directory.`, next: 'Confirm with procurement which legal entity was ordered from. Do not pay on a similar name.' };
    }
    case 'BUYER_IDENTITY':
      return { title: 'Buyer does not match the order', body: `Billed to ${esc(x.buyer.legal_name)} (<span class="mono">${esc(x.buyer.registration_id)}</span>).`, next: 'Confirm the intended legal entity with procurement.' };
    case 'CURRENCY_MATCH':
      return { title: 'Currency differs from the order', body: `Invoice in ${esc(x.currency)}.`, next: 'Request an invoice in the order currency.' };
    case 'DOCUMENT_CONFLICT':
      return { title: 'Same invoice number, different content', body: `An invoice with the same supplier, buyer and number is already counted (<span class="mono">${esc(o.original_document_id)}</span>), but the facts differ — see the comparison below. The original is kept unchanged.`, next: 'Find out from the supplier whether this is a correction; never pay both.' };
    case 'ORDER_MATCH':
      return { title: 'Order proposed by the agent — needs your confirmation', body: `The agent proposes order ${esc(o.matched_order_id)}. Other checks were evaluated against it so you can see the consequences.`, next: 'Review the proposal below and confirm it if it is right.' };
    case 'LINE_MATCH':
      if (lr && lr.match_source === 'agent_proposal' && ol && ol.line.unit === dl.unit)
        return { title: 'Line linked by the agent — needs your confirmation', body: `${lineName}proposed order line “${esc(ol.line.description)}”.`, next: 'Confirm with the proposal below.' };
      return { title: 'Unit of measure differs from the order', body: `${lineName}invoice unit ${esc(dl?.unit)}, order unit ${esc(ol?.line.unit)}. Quantity and price checks are not applicable.`, next: 'Agree the conversion with procurement; request a corrected invoice if needed.' };
  }
  return { title: CHECK_TITLES[c.code], body: '', next: '' };
}

function rootIssues(id, o) {
  const roots = o.checks.filter(c => c.status === 'fail' || (c.status === 'unknown' && c.depends_on == null));
  const waiting = {};
  o.checks.filter(c => c.status === 'unknown' && c.depends_on).forEach(c => { waiting[c.depends_on] = (waiting[c.depends_on] || 0) + 1; });
  const order = { blocked: 0, unknown: 1, needs_review: 2 };
  roots.sort((a, b) => (order[a.severity || 'unknown'] ?? 3) - (order[b.severity || 'unknown'] ?? 3));
  return { roots, waiting };
}

function queueSummary(id) {
  const steps = visibleSteps(id), o = steps[steps.length - 1].output;
  if (o.import_disposition === 'duplicate') return { what: `Resend of ${o.original_document_id}`, who: 'Accounts payable' };
  if (o.decision === 'clear') return { what: 'All checks passed', who: '—' };
  const r = rootIssues(id, o).roots[0];
  const t = issueText(id, o, r);
  return { what: t.title + (r.object_id.startsWith('L') ? ` (line ${r.object_id})` : ''), who: WHO[r.code] };
}

const STAGES = { attention: 'Needs attention', ready: 'Ready for accounting', closed: 'Closed' };
function stageOf(o) { return o.import_disposition === 'duplicate' ? 'closed' : o.decision === 'clear' ? 'ready' : 'attention'; }
function stageOfCase(id) { return state.accepted[id] ? 'ready' : stageOf(latestOutput(id)); }
function latestOutput(id) { const s = visibleSteps(id); return s[s.length - 1].output; }

function renderCases() {
  const ids = Object.keys(DATA);
  const counts = {};
  ids.forEach(id => { const k = stageOfCase(id); counts[k] = (counts[k] || 0) + 1; });
  const shown = ids.filter(id => stageOfCase(id) === state.stage);
  const head = {
    attention: '<th>Result</th><th>What needs attention</th><th class="hide-sm">Who should look</th>',
    ready: '<th>Result</th><th>Accounting</th><th class="hide-sm">Checked at</th>',
    closed: '<th>Result</th><th>Why closed</th><th class="hide-sm"></th>',
  }[state.stage];
  const rows = shown.map(id => {
    const d = DATA[id], o = latestOutput(id), x = ext(id);
    let cols;
    if (state.stage === 'attention') { const sum = queueSummary(id); cols = `<td>${badge(o)}</td><td>${esc(sum.what)}</td><td class="hide-sm">${esc(sum.who)}</td>`; }
    else if (state.stage === 'ready') cols = `<td>${badge(o)}</td><td>${state.accepted[id] ? `Accepted with discrepancy by ${esc(state.accepted[id].by)}` : 'Handed over automatically'} <span class="faint">(simulated)</span></td><td class="hide-sm faint">revision ${o.input_revision} · ${esc(o.context_version)}</td>`;
    else cols = `<td>${badge(o)}</td><td>Resend of <span class="mono">${esc(o.original_document_id)}</span>, nothing goes further</td><td class="hide-sm"></td>`;
    return `<tr class="click" data-open="${id}">
      <td><b>${esc(x.number)}</b><div class="faint mono">${id}${d.own_scenario ? ' · own scenario' : ''}</div></td>
      <td>${esc(x.supplier.legal_name)}<div class="faint" style="white-space:nowrap">issued ${esc(x.issue_date)}</div></td>
      <td class="num" style="text-align:right;white-space:nowrap">${money(x.declared_total)} ${esc(x.currency || '')}</td>${cols}</tr>`;
  }).join('');
  return `<h1>Cases</h1>
    <div class="req idea"><b>Agreed 22.11:</b> the list is split by stage. “Needs attention” stays with people until resolved; “Ready for accounting” holds every clear invoice, handed over without a person (the hand-over itself is simulated — integration goes to the cover letter); duplicates are closed.</div>
    <div class="filters">${Object.entries(STAGES).map(([k, v]) => `<span class="chip ${state.stage === k ? 'on' : ''}" data-stage="${k}">${v} · ${counts[k] || 0}</span>`).join('')}</div>
    <div class="section" style="padding:6px 8px"><table>
      <thead><tr><th>Invoice</th><th>Supplier</th><th style="text-align:right">Amount</th>${head}</tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="faint">Nothing here.</td></tr>'}</tbody></table></div>`;
}

function renderStepper(id, o) {
  const hadIssues = visibleSteps(id).some(s => stageOf(s.output) === 'attention');
  const stage = stageOf(o);
  if (stage === 'closed') return `<div class="stepper"><span class="sp done">Received</span><span class="sp cur">Closed as duplicate</span></div>`;
  const steps = [
    ['Received', 'done'],
    ['Checked by rules', 'done'],
    ...(hadIssues ? [['Resolved by people', stage === 'attention' ? 'cur' : 'done']] : []),
    ['Ready for accounting', stage === 'ready' ? 'cur' : 'todo'],
    ['Posted in accounting', 'out'],
    ['Paid in a payment run', 'out'],
  ];
  return `<div class="stepper">${steps.map(([t, k]) => `<span class="sp ${k}"${k === 'out' ? ' title="Outside this system"' : ''}>${t}</span>`).join('<span class="sp-arrow">›</span>')}</div>`;
}

function renderAttention(id, o) {
  if (o.import_disposition === 'duplicate') {
    return `<div class="section"><div class="section-head"><h2>Needs attention</h2></div>
      <div class="issue"><span class="st st-not_applicable">=</span><div><div class="t">This is a resend of an invoice already registered: <span class="mono">${esc(o.original_document_id)}</span></div>
      <div class="muted">Same supplier, buyer, invoice number and the same facts as the original (from the invoice history or imported earlier); only the layout may differ. No new assessment was created and nothing goes onward again.</div>
      <div class="meta"><span><b>Who:</b> Accounts payable</span><span><b>Next:</b> do not process again; tell the supplier the original's status if asked.</span></div></div></div></div>`;
  }
  if (o.decision === 'clear') {
    return `<div class="section"><div class="allgood"><span class="st st-pass">✓</span><div><b>All ${o.checks.length} checks passed — ready for accounting, no action needed.</b><div class="muted">Handed over to accounting automatically (simulated). Accounting posts it; the payment is approved in a payment run. Once posted, it comes back as “counted” in the invoice history, so later duplicates and over-billing are caught.</div>
      <div class="req idea" style="margin-top:8px"><b>Cover letter:</b> real hand-over to the accounting system, the “counted” feedback, and a re-check on fresh data right before the payment run (IBAN or order balance can change in between).</div></div></div></div>`;
  }
  const { roots, waiting } = rootIssues(id, o);
  const acc = state.accepted[id];
  const pendingProposal = o.order_match_source === 'agent_proposal' || o.lines.some(l => l.match_source === 'agent_proposal');
  const canAccept = o.decision === 'needs_review' && !pendingProposal && currentIndex(id) === visibleSteps(id).length - 1;
  const accept = acc ? `<div class="resolution"><span class="st st-pass">✓</span><div><b>Accepted with discrepancy by ${esc(acc.by)}</b> — “${esc(acc.reason)}”<div class="muted">The rules' result stays <b>Needs review</b>; a person decided to let the invoice go on, and the invoice is ready for accounting.</div></div></div>`
    : canAccept ? (state.acceptOpen === id ? `<div class="accept-form"><div><b>Accept the discrepancy</b> <span class="faint">— your decision is recorded with the reason; the rules' result does not change.</span></div>
        <div class="confirm" style="border-top:0;padding-top:6px;margin-top:6px"><input type="text" id="accName" placeholder="Your name"><input type="text" id="accReason" placeholder="Reason, e.g. price 12.52 agreed with the supplier" style="flex:1;min-width:260px"><button class="btn" id="accSave" disabled>Accept</button><button class="btn ghost" id="accCancel">Cancel</button></div></div>`
      : `<div style="margin-top:10px"><button class="btn ghost" id="accOpen">Accept discrepancy…</button> <span class="faint" style="font-size:13px">for when the difference is justified, e.g. the price was agreed</span></div>`) : '';
  const items = roots.map(c => { const t = issueText(id, o, c); return `<div class="issue">${stHtml(c)}<div>
      <div class="t">${t.title}${c.object_id.startsWith('L') ? '' : ''}</div><div class="muted">${t.body}</div>
      <div class="meta"><span><b>Who should look:</b> ${esc(WHO[c.code])}</span><span><b>Next:</b> ${t.next}</span></div></div></div>`; }).join('');
  const wait = Object.entries(waiting).map(([dep, n]) => `<div class="waiting faint">${n} more check${n > 1 ? 's' : ''} wait for “${esc(CHECK_TITLES[dep])}” and will be evaluated once it is resolved.</div>`).join('');
  return `<div class="section"><div class="section-head"><h2>Needs attention</h2><span class="aside faint">${roots.length} issue${roots.length > 1 ? 's' : ''}</span></div>
    <div class="req"><b>Agreed 22.11:</b> each problem in plain words — what does not match, who should look, next step. Static hints by check type, page-only (not in the runner output). One question per missing fact; dependent checks are summarised, not repeated.</div>
    ${items}${wait}${accept}
    ${canAccept || acc ? '<div class="req"><b>Agreed 22.11:</b> for <i>needs review</i> only (never for blocked), a person can accept the discrepancy with a required reason. The rules\' result stays needs_review; the human decision is recorded separately and moves the invoice to Ready for accounting. Not part of the runner output.</div>' : ''}</div>`;
}

function renderProposal(id, idx, o) {
  const props = proposalsUpTo(id, idx);
  if (!props.length) return '';
  const confs = confirmationsUpTo(id, idx), ctx = contextAt(id, idx), x = extractionAt(id, idx);
  return props.map(p => {
    const conf = confs.find(c => c.proposal_id === p.proposal_id);
    const ord = ctx.purchase_orders.orders.find(r => r.order_id === p.order_id);
    const others = ctx.purchase_orders.orders.filter(r => r.order_id !== p.order_id && r.status === 'open' && r.supplier_id === ord.supplier_id);
    const maps = p.line_matches.map(m => { const dl = x.lines.find(l => l.line_id === m.document_line_id), ol = findOrderLine(ctx, m.order_line_id).line;
      return `<div class="map"><div class="box"><div class="faint">Invoice line ${esc(dl.line_id)}</div>“${esc(dl.description)}” · ${qty(dl.quantity)} ${esc(dl.unit)} × ${money(dl.unit_net_price)}</div><div style="text-align:center">→</div>
        <div class="box"><div class="faint">Order line ${esc(ol.line_id)}</div>“${esc(ol.description)}” · ${qty(ol.quantity)} ${esc(ol.unit)} × ${money(ol.unit_net_price)}</div></div>`; }).join('');
    const auto = o.lines.filter(l => l.match_source === 'deterministic').map(l => l.document_line_id);
    const curedByConfirmation = c => {
      if (c.status !== 'fail') return false;
      if (c.code === 'ORDER_MATCH') return o.order_match_source === 'agent_proposal';
      if (c.code !== 'LINE_MATCH') return false;
      const lr = o.lines.find(l => l.document_line_id === c.object_id), dl = x.lines.find(l => l.line_id === c.object_id), ol = lr && lr.order_line_id && findOrderLine(ctx, lr.order_line_id);
      return lr && lr.match_source === 'agent_proposal' && ol && ol.line.unit === dl.unit;
    };
    const rest = o.checks.filter(c => !curedByConfirmation(c));
    const after = rest.some(c => c.status === 'fail' && c.severity === 'blocked') ? 'blocked' : rest.some(c => c.status === 'unknown') ? 'needs_information' : rest.some(c => c.status === 'fail') ? 'needs_review' : 'clear';
    const head = `<div class="section-head"><h2>Agent proposal <span class="mono faint">${esc(p.proposal_id)}</span></h2><span class="aside">${conf ? `<span class="src src-human_confirmation">confirmed by ${esc(state.confirmedBy[id] || conf.confirmed_by)}</span>` : '<span class="src src-agent_proposal">waiting for confirmation</span>'}</span></div>`;
    const body = `<div>This invoice belongs to order <b>${esc(ord.order_id)}</b> <span class="mono">(${esc(ord.reference)})</span>.</div>${maps}
      ${auto.length ? `<div class="faint" style="font-size:13px">Matched automatically inside this order: ${auto.map(esc).join(', ')} (same SKU, alias or description).</div>` : ''}
      ${others.length ? `<div class="faint" style="font-size:13px">Other open orders of this supplier: ${others.map(r => `${esc(r.order_id)} (${esc(r.reference)})`).join(', ')} — check the delivery documents to tell them apart.</div>` : ''}`;
    const latest = idx === visibleSteps(id).length - 1;
    const form = conf || !latest ? '' : `<div class="confirm"><div style="flex-basis:100%;font-size:13px">If you confirm: the order and line links become <b>human confirmation</b>; other checks stay as they are → expected result ${badge({ decision: after, import_disposition: 'new' })}</div>
      <input type="text" id="confirmName" placeholder="Your name">
      <label><input type="checkbox" id="confirmCheck"> I checked this against the delivery documents</label>
      <button class="btn" id="confirmBtn" disabled>Confirm this proposal</button></div>`;
    return `<div class="section">${head}
      <div class="req"><b>Assignment R2, BUILD-5, REVIEW-4:</b> a human confirms one specific registered proposal, only on this page — the MCP has no confirm operation. Until confirmed, other checks are computed against the proposed order so the consequences are visible. Confirmation creates a new revision and a new assessment.</div>
      <div class="proposal ${conf ? 'done' : ''}">${body}${form}</div></div>`;
  }).join('');
}

function matchHow(dl, ol, lr, id) {
  if (lr.match_source === 'agent_proposal') return '<span class="src src-agent_proposal">proposed by the agent</span>';
  if (lr.match_source === 'human_confirmation') return `<span class="src src-human_confirmation">confirmed by ${esc(state.confirmedBy[id] || 'a person')}</span>`;
  if (dl.sku && norm(dl.sku) === norm(ol.sku)) return '<span class="faint">same SKU</span>';
  const n = s => (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  if ((ol.explicit_aliases || []).some(a => n(a) === n(dl.description))) return '<span class="faint">order alias</span>';
  return '<span class="faint">same description</span>';
}

function renderLines(id, o) {
  if (!o.lines.length) return '';
  const x = ext(id), ctx = contextAt(id, currentIndex(id));
  const cards = o.lines.map(lr => {
    const dl = x.lines.find(l => l.line_id === lr.document_line_id), found = lr.order_line_id ? findOrderLine(ctx, lr.order_line_id) : null, ol = found && found.line;
    const c = code => check(o, code, lr.document_line_id);
    const lineChecks = ['LINE_MATCH', 'QTY_RECEIVED', 'QTY_ORDER_REMAINING', 'UNIT_PRICE', 'LINE_ARITHMETIC'].map(c);
    const ok = lineChecks.every(k => k.status === 'pass');
    const priceDelta = ol ? (Number(dl.unit_net_price) - Number(ol.unit_net_price)).toFixed(2) : null;
    const summary = `<summary class="line-sum">${stHtml(ok ? lineChecks[0] : lineChecks.find(k => k.status !== 'pass'))}
        <span><span class="tag tag-doc">Invoice</span> <b>${esc(dl.line_id)}</b> “${esc(dl.description)}”</span>
        <span class="faint">${qty(dl.quantity)} ${esc(dl.unit)} × ${money(dl.unit_net_price)} = ${money(dl.declared_net_amount)}</span>
        <span class="faint" style="margin-left:auto">${ok ? 'all checks passed' : lineChecks.filter(k => k.status !== 'pass').length + ' to look at'}</span></summary>`;
    const pair = `<div class="pair">
        <div class="box"><div class="tag tag-doc">Invoice line ${esc(dl.line_id)}</div>“${esc(dl.description)}”<div class="faint mono">${dl.sku ? 'SKU ' + esc(dl.sku) : 'no SKU'}</div></div>
        <div class="pair-mid">→<div>${ol ? matchHow(dl, ol, lr, id) : '<span class="missing">no order line</span>'}</div></div>
        <div class="box">${ol ? `<div class="tag tag-co">Order line ${esc(ol.line_id)} · ${esc(found.order.reference)}</div>“${esc(ol.description)}”<div class="faint mono">${ol.sku ? 'SKU ' + esc(ol.sku) : 'no SKU'}</div>` : '<div class="tag tag-co">Order line</div><span class="missing">not identified yet</span>'}</div></div>`;
    const inp = (src, label, val) => `<div class="in"><span class="in-src in-${src === 'Invoice' ? 'doc' : 'co'}">${src}</span><span>${label}</span><b>${val}</b></div>`;
    const verdictLabel = k => k.status === 'pass' ? 'OK' : k.status === 'fail' ? (k.severity === 'blocked' ? 'Blocked' : 'Needs review') : k.status === 'unknown' ? 'Cannot check yet' : 'Not applicable';
    const chk = (k, formula) => {
      const why = k.status === 'unknown' ? (k.depends_on ? `waits for: ${esc(CHECK_TITLES[k.depends_on].toLowerCase())}` : 'missing data') : k.status === 'not_applicable' ? 'units differ from the order' : formula;
      return `<div class="chk ${stClass(k).replace('st-', 'chk-')}"><div class="chk-h">${stHtml(k)}<span>Check</span><b>${verdictLabel(k)}</b></div><div class="chk-f">${why}</div></div>`;
    };
    const q = Number(dl.quantity), avail = lr.available_to_invoice, rem = lr.remaining_on_order;
    const cmp = (a, b) => Number(a) <= Number(b) ? '≤' : '>';
    const grid = `<div class="line-grid">
        <div class="cell"><div class="h">Price</div>
          ${inp('Invoice', 'unit price', money(dl.unit_net_price))}${inp('Order', 'unit price', ol ? money(ol.unit_net_price) : '—')}
          ${chk(c('UNIT_PRICE'), ol ? `difference ${Math.abs(priceDelta).toFixed(2)} ${Math.abs(priceDelta) <= 0.01 ? '≤' : '>'} tolerance 0.01` : '')}</div>
        <div class="cell"><div class="h">Quantity, ${esc(dl.unit)}</div>
          ${inp('Invoice', 'invoiced', qty(dl.quantity))}${inp('Order', 'ordered', qty(lr.ordered))}${inp('Receipts', 'received', qty(lr.received))}${inp('History', 'invoiced before', qty(lr.previously_invoiced))}
          ${chk(c('QTY_RECEIVED'), avail == null ? '' : `invoiced ${qty(q)} ${cmp(q, avail)} ${qty(avail)} available (${qty(lr.received)} received − ${qty(lr.previously_invoiced)} invoiced before)`)}
          ${chk(c('QTY_ORDER_REMAINING'), rem == null ? '' : `invoiced ${qty(q)} ${cmp(q, rem)} ${qty(rem)} left on order (${qty(lr.ordered)} ordered − ${qty(lr.previously_invoiced)} invoiced before)`)}</div>
        <div class="cell"><div class="h">Arithmetic</div>
          ${inp('Invoice', 'net amount', money(dl.declared_net_amount))}${inp('Invoice', 'VAT ' + Number(dl.tax_rate) * 100 + '%', money(dl.declared_tax_amount))}
          ${chk(c('LINE_ARITHMETIC'), `${qty(dl.quantity)} × ${money(dl.unit_net_price)} = ${money(lr.calculated_net)} ${Number(lr.calculated_net) === Number(dl.declared_net_amount) ? '=' : '≠'} net<br>${money(lr.calculated_net)} × ${Number(dl.tax_rate) * 100}% = ${money(lr.calculated_tax)} ${dl.declared_tax_amount == null || Number(lr.calculated_tax) === Number(dl.declared_tax_amount) ? '=' : '≠'} VAT`)}</div>
      </div>`;
    return `<details class="line-card" ${ok ? '' : 'open'}>${summary}${pair}${grid}</details>`;
  }).join('');
  const t = o.totals, tc = check(o, 'TOTALS_ARITHMETIC'), x2 = ext(id);
  const eq = (a, b) => Number(a) === Number(b) ? '=' : '≠';
  const totals = `<details class="line-card" ${tc.status === 'pass' ? '' : 'open'}><summary class="line-sum">${stHtml(tc)} <b>Totals</b> <span class="faint">${money(x2.declared_subtotal)} + ${money(x2.declared_tax_total)} VAT = ${money(x2.declared_total)} ${esc(x2.currency || '')}</span><span class="faint" style="margin-left:auto">${tc.status === 'pass' ? 'adds up' : 'does not add up'}</span></summary>
    <div class="line-grid"><div class="cell" style="grid-column: span 3"><div class="h">Totals</div>
      <div class="in"><span class="in-src in-doc">Invoice</span><span>subtotal · VAT total · total</span><b>${money(x2.declared_subtotal)} · ${money(x2.declared_tax_total)} · ${money(x2.declared_total)}</b></div>
      <div class="chk ${stClass(tc).replace('st-', 'chk-')}"><div class="chk-h">${stHtml(tc)}<span>Check</span><b>${tc.status === 'pass' ? 'OK' : 'Blocked'}</b></div>
      <div class="chk-f">sum of line nets ${money(t.calculated_subtotal)} ${eq(t.calculated_subtotal, x2.declared_subtotal)} subtotal · sum of line VAT ${money(t.calculated_tax_total)} ${eq(t.calculated_tax_total, x2.declared_tax_total)} VAT total · ${money(t.calculated_subtotal)} + ${money(t.calculated_tax_total)} = ${money(t.calculated_total)} ${eq(t.calculated_total, x2.declared_total)} total</div></div>
    </div></div></details>`;
  return `<div class="section"><div class="section-head"><h2>Lines and calculations</h2><span class="aside"><span class="in-src in-doc">Invoice</span> read from the PDF · <span class="in-src in-co">Order</span> <span class="in-src in-co">Receipts</span> <span class="in-src in-co">History</span> company data · <span class="chk-legend">Check</span> calculation and verdict</span></div>
    <div class="req"><b>BUILD-5, R3, R4 + owner 22.11:</b> lines that pass are collapsed, lines with problems open. Inputs say where each number comes from; every check shows its own calculation and verdict, visually separate from the inputs.</div>
    ${cards}${totals}</div>`;
}

function renderConflict(id, o) {
  if (o.import_disposition !== 'conflict') return '';
  const ctx = contextAt(id, currentIndex(id)), orig = ctx.invoice_history.documents.find(d => d.document_id === o.original_document_id), x = ext(id), nf = orig.normalized_facts;
  const rows = [];
  [['issue_date', x.issue_date], ['due_date', x.due_date], ['currency', x.currency], ['purchase_order_reference', x.purchase_order_reference], ['iban', x.bank.iban], ['declared_subtotal', x.declared_subtotal], ['declared_tax_total', x.declared_tax_total], ['declared_total', x.declared_total]]
    .forEach(([k, v]) => { if (String(nf[k]) !== String(v)) rows.push([k, nf[k], v]); });
  x.lines.forEach(l => { const ol = nf.lines.find(n => n.sku === l.sku); if (!ol) return; ['quantity', 'unit_net_price', 'declared_net_amount', 'declared_tax_amount'].forEach(k => { if (Number(ol[k]) !== Number(l[k])) rows.push([`${l.sku} ${k}`, ol[k], l[k]]); }); });
  return `<div class="section"><div class="section-head"><h2>Differences from the counted original</h2><span class="aside mono faint">${esc(orig.document_id)}</span></div>
    <div class="req"><b>R6:</b> same business key, different normalized facts → conflict; the original is never overwritten. (A full version-comparison UI is out of scope; this is only the list of differing facts.)</div>
    <table><thead><tr><th>Fact</th><th>Original</th><th>This document</th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${esc(r[0])}</td><td class="num">${esc(r[1])}</td><td class="num"><b>${esc(r[2])}</b></td></tr>`).join('')}</tbody></table></div>`;
}

function renderChecks(o) {
  if (!o.checks.length) return '';
  const rows = o.checks.filter(c => !state.hidePassed || c.status !== 'pass').map(c => `<tr><td>${stHtml(c)}</td><td>${esc(CHECK_TITLES[c.code])}<div class="mono faint">${c.code}</div></td><td class="mono">${esc(c.object_id)}</td><td>${esc(c.status)}${c.severity ? ' · ' + esc(c.severity) : ''}</td><td class="mono faint">${esc(c.depends_on || '')}</td></tr>`).join('');
  const passed = o.checks.filter(c => c.status === 'pass').length;
  return `<div class="section"><div class="section-head"><h2>All checks</h2><span class="aside"><label style="cursor:pointer"><input type="checkbox" id="hidePassed" ${state.hidePassed ? 'checked' : ''}> hide ${passed} passed</label></span></div>
    <div class="req"><b>Policy:</b> every result keeps the full fixed set — 7 document checks + 5 per line — whatever the decision.</div>
    <table><thead><tr><th></th><th>Check</th><th>Object</th><th>Status</th><th>Waits for</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="faint">All checks passed.</td></tr>'}</tbody></table></div>`;
}

function pointer(obj, path) { return path.split('/').slice(1).reduce((a, k) => a == null ? a : a[k], obj); }
const FIELD_LABEL = p => p.replace(/^\//, '').replace(/\/(\d+)\//, (m, i) => ` ${Number(i) + 1} · `).replace(/_/g, ' ').replace(/\//g, ' · ');

function renderFacts(id) {
  const d = DATA[id], x = ext(id), latestView = currentIndex(id) === visibleSteps(id).length - 1;
  const byPath = {};
  x.evidence.forEach(e => (byPath[e.field_path] = byPath[e.field_path] || []).push(e));
  x.missing_fields.forEach(m => byPath[m.field_path] = byPath[m.field_path] || []);
  const groups = { Document: [], Parties: [], Bank: [], Lines: [], Totals: [] };
  Object.keys(byPath).forEach(p => {
    const g = p.startsWith('/lines') ? 'Lines' : p.startsWith('/supplier') || p.startsWith('/buyer') ? 'Parties' : p.startsWith('/bank') ? 'Bank' : p.startsWith('/declared') ? 'Totals' : 'Document';
    groups[g].push(p);
  });
  const row = p => { const miss = x.missing_fields.find(m => m.field_path === p), v = pointer(x, p);
    const corr = (state.corrections[id] || {})[p];
    const editing = state.editing === p;
    const value = miss ? `<span class="missing">${miss.reason === 'illegible' ? 'illegible in the document' : 'not in the document'}</span>` : esc(v);
    const cell = editing ? `<div class="edit"><input type="text" id="editValue" value="${esc(v ?? '')}"><input type="text" id="editReason" placeholder="Why, e.g. the PDF says 6.40"><button class="btn" id="editSave">Save</button><button class="btn ghost" id="editCancel">Cancel</button></div>`
      : `${value}${corr ? `<div class="faint" style="font-family:Inter,sans-serif;font-size:11.5px">corrected by ${esc(corr.by)}: was ${esc(corr.from)} — ${esc(corr.reason)}</div>` : ''} ${latestView && !miss ? `<span class="edit-link" data-edit="${esc(p)}">edit</span>` : ''}`;
    return `<tr><td>${esc(FIELD_LABEL(p))}</td>
      <td class="fact-src">${(byPath[p] || []).map(e => `<span class="pdf-quote">${esc(e.excerpt)}</span> <span class="faint">p.${e.page}</span>`).join('<br>') || '<span class="faint">—</span>'}</td>
      <td class="mono">${cell}</td></tr>`; };
  const head = '<thead><tr><th>Field</th><th><span class="tag tag-pdf">PDF</span> exact text on the page</th><th><span class="tag tag-doc">Parsed</span> value used by the rules</th></tr></thead>';
  return `<div class="section"><div class="section-head"><h2>What was read from the document</h2><span class="aside"><span class="link" title="${esc('dataset/cases/' + id + '/' + d.pdf)}">${esc(d.pdf.split('/').pop())}</span> · <span class="faint">read by the agent</span></span></div>
    <div class="req"><b>BUILD-3 + agreed 22.11:</b> each fact keeps document, page and verbatim excerpt. Left: what is printed in the PDF; right: the parsed value. A person corrects a misread value here (with a reason); the correction is a new revision, not a re-import. So a person can tell a reading error from a real data discrepancy. Missing facts are null with a reason, never filled from directories.</div>
    ${state.flash[id + ':edit'] ? `<div class="flash">${state.flash[id + ':edit']}</div>` : ''}${Object.entries(groups).filter(([, v]) => v.length).map(([g, ps]) => `<details ${g === 'Document' || ps.includes(state.editing) || ps.some(p => (state.corrections[id] || {})[p]) || (id === 'case-102' && g === 'Lines') ? 'open' : ''}><summary>${g} <span class="faint">· ${ps.length}</span></summary><table class="facts"><colgroup><col style="width:24%"><col style="width:44%"><col style="width:32%"></colgroup>${head}<tbody>${ps.map(row).join('')}</tbody></table></details>`).join('')}</div>`;
}

function stepStory(id, i) {
  const s = DATA[id].steps[i], parts = [];
  let actor = 'Agent';
  if (s.has_document && s.corrected_document) parts.push(`Registered the supplier's corrected invoice as version ${docVersion(id, i)} (version ${docVersion(id, i) - 1} kept as replaced)`);
  else if (s.has_document) parts.push(`Registered facts from ${esc(DATA[id].pdf.split('/').pop())} (${extractionAt(id, i).evidence.length} sources)`);
  if (s.correction) { actor = 'Person'; const c = (state.corrections[id] || {})[s.correction.field]; parts.push(`${esc(c?.by || ME)} corrected ${esc(FIELD_LABEL(s.correction.field))}: ${esc(s.correction.from)} → ${esc(s.correction.to)}${c ? ' — ' + esc(c.reason) : ''}`); }
  if (s.input.context) {
    const prev = i > 0 ? contextAt(id, i - 1) : null;
    if (prev) { actor = 'System'; const sum = c => c.goods_receipts.receipts.reduce((a, r) => a + Number(r.accepted_quantity), 0);
      parts.push(`Company data updated ${esc(prev.context_version)} → ${esc(s.input.context.context_version)}: goods received ${sum(prev)} → ${sum(s.input.context)}`); }
    else parts.push(`company data ${esc(s.input.context.context_version)}`);
  }
  (s.input.proposals || []).forEach(p => parts.push(`Proposed order ${esc(p.order_id)} and ${p.line_matches.length} line link${p.line_matches.length === 1 ? '' : 's'} (${esc(p.proposal_id)})`));
  (s.input.confirmations || []).forEach(c => { actor = 'Person'; parts.push(`${esc(state.confirmedBy[id] || c.confirmed_by)} confirmed ${esc(c.proposal_id)} on this page`); });
  return { actor, text: parts.join(' · ') };
}

function renderHistory(id) {
  const steps = visibleSteps(id), cur = currentIndex(id);
  const items = steps.map((s, i) => ({ s, i })).reverse().map(({ s, i }) => { const st = stepStory(id, i);
    return `<li class="${i === cur ? 'cur' : ''}" data-step="${i}"><span class="rev">r${s.output.input_revision}</span><div><div class="actor">${st.actor}</div>${st.text}<div class="faint" style="font-size:12px">policy ${esc(s.output.policy_version)} · company data ${esc(s.output.context_version)} · document ${esc(s.output.document_id)}</div></div>${badge(s.output)}</li>`; }).join('');
  const acc = state.accepted[id];
  const accItem = acc ? `<li><span class="rev">—</span><div><div class="actor">Person</div>${esc(acc.by)} accepted the discrepancy: “${esc(acc.reason)}” <span class="faint">(rules' result unchanged)</span></div><span class="badge d-clear"><span class="dot"></span>Accepted</span></li>` : '';
  const simulate = id === 'case-103' && steps.length === 1 ? `<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn ghost" id="simCorrected">▶ Simulate: the supplier's corrected invoice arrives</button><span class="faint" style="font-size:13px">the agent reads it and registers it through MCP as a new version of this invoice</span></div>` : '';
  return `<div class="section"><div class="section-head"><h2>History</h2><span class="aside faint">click a revision to see it</span></div>
    <div class="req"><b>BUILD-3, REVIEW-4, REVIEW-6, BR “Вычисляемые значения”:</b> each assessment names policy, company-data version and input revision; every change of facts, proposals, confirmations or company data → new revision and a new assessment; earlier ones are kept and can be opened.</div>
    <ul class="timeline">${accItem}${items}</ul>${simulate}</div>`;
}

function renderCase(id) {
  const d = DATA[id], steps = visibleSteps(id), idx = currentIndex(id), x = extractionAt(id, idx), o = steps[idx].output, ctx = contextAt(id, idx), ver = docVersion(id, idx);
  const latest = idx === steps.length - 1;
  const ord = o.matched_order_id ? ctx.purchase_orders.orders.find(r => r.order_id === o.matched_order_id) : null;
  return `<div class="faint" style="margin-bottom:8px"><span class="link" id="backBtn">← Cases</span> / ${esc(x.number)}</div>
    <div class="section" style="margin-top:0">
      <div class="case-head"><div>
        <h1>${esc(x.number)}</h1>
        <div style="margin-top:4px">${esc(x.supplier.legal_name)} <span class="faint">→</span> ${esc(x.buyer.legal_name)}</div>
        <div class="faint" style="margin-top:2px;font-size:13px">Issued ${esc(x.issue_date)} · due ${esc(x.due_date || '—')} · PO ${x.purchase_order_reference ? `<span class="mono">${esc(x.purchase_order_reference)}</span>` : '<span class="missing">not in document</span>'}${ord ? ` · ${o.order_match_source === 'agent_proposal' ? 'proposed' : 'matched'} order <span class="mono">${esc(ord.order_id)}</span>` : ''}${ver > 1 ? ` · <b>document version ${ver}</b> (corrected invoice)` : ''}${d.own_scenario ? ` · <b>own scenario:</b> ${esc(d.own_scenario)}` : ''}</div>
      </div><div><div class="amount num">${money(x.declared_total)} ${esc(x.currency || '')}</div><div style="text-align:right;margin-top:6px">${badge(o, true)}</div></div></div>
      ${o.import_disposition !== 'duplicate' && latest ? `<div class="actions"><button class="btn ghost" id="recheckBtn">↻ Re-check with the latest company data</button>${state.flash[id] ? `<span class="flash">${state.flash[id]}</span>` : '<span class="faint" style="font-size:13px">after orders, receipts, supplier details or history were fixed in the accounting system</span>'}</div>
      <div class="req"><b>REQ-UI-21 (agreed 22.11):</b> runs the same re-check as MCP against the latest company-data snapshot loaded by the operator; a new revision only if the data changed. Company data itself is never edited on this page.</div>` : ''}
      ${latest ? '' : `<div class="old-rev">You are looking at revision ${o.input_revision}, which has been superseded. <span class="link" id="latestBtn">Open the latest</span></div>`}
    </div>
    ${renderAttention(id, o)}
    ${renderProposal(id, idx, o)}
    ${renderConflict(id, o)}
    ${renderLines(id, o)}
    ${renderChecks(o)}
    ${renderFacts(id)}
    ${renderHistory(id)}`;
}

function render() {
  document.getElementById('page').innerHTML = state.view === 'cases' ? renderCases() : renderCase(state.caseId);
  bind();
}

function bind() {
  const page = document.getElementById('page');
  page.querySelectorAll('[data-open]').forEach(el => el.onclick = () => { state.view = 'case'; state.caseId = el.dataset.open; render(); });
  page.querySelectorAll('[data-stage]').forEach(el => el.onclick = () => { state.stage = el.dataset.stage; render(); });
  page.querySelectorAll('[data-step]').forEach(el => el.onclick = () => { state.viewStep[state.caseId] = Number(el.dataset.step); render(); });
  const back = document.getElementById('backBtn'); if (back) back.onclick = () => { state.view = 'cases'; render(); };
  const latest = document.getElementById('latestBtn'); if (latest) latest.onclick = () => { delete state.viewStep[state.caseId]; render(); };
  const hp = document.getElementById('hidePassed'); if (hp) hp.onchange = () => { state.hidePassed = hp.checked; render(); };
  const name = document.getElementById('confirmName'), chk = document.getElementById('confirmCheck'), btn = document.getElementById('confirmBtn');
  if (btn) {
    const upd = () => btn.disabled = !(name.value.trim() && chk.checked);
    name.oninput = upd; chk.onchange = upd;
    btn.onclick = () => { state.confirmedBy[state.caseId] = name.value.trim(); state.visible[state.caseId] = DATA[state.caseId].steps.length; delete state.viewStep[state.caseId]; render(); };
  }
  const id = state.caseId;
  const rc = document.getElementById('recheckBtn');
  if (rc) rc.onclick = () => {
    if (id === 'case-101' && visibleSteps(id).length === 1) { state.visible[id] = 2; state.flash[id] = 'Company data changed (CTX-101-v2: the receipt was posted) — new revision created.'; }
    else state.flash[id] = `Company data unchanged since revision ${latestOutput(id).input_revision} (${latestOutput(id).context_version}) — no new revision.`;
    render();
  };
  const sim = document.getElementById('simCorrected'); if (sim) sim.onclick = () => { state.visible[id] = 2; render(); };
  const ao = document.getElementById('accOpen'); if (ao) ao.onclick = () => { state.acceptOpen = id; render(); };
  const ac = document.getElementById('accCancel'); if (ac) ac.onclick = () => { state.acceptOpen = null; render(); };
  const an = document.getElementById('accName'), ar = document.getElementById('accReason'), as = document.getElementById('accSave');
  if (as) { const upd = () => as.disabled = !(an.value.trim() && ar.value.trim()); an.oninput = upd; ar.oninput = upd;
    as.onclick = () => { state.accepted[id] = { by: an.value.trim(), reason: ar.value.trim() }; state.acceptOpen = null; render(); }; }
  page.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => { state.editing = el.dataset.edit; render(); });
  const ec = document.getElementById('editCancel'); if (ec) ec.onclick = () => { state.editing = null; render(); };
  const es = document.getElementById('editSave');
  if (es) es.onclick = () => {
    const p = state.editing, val = document.getElementById('editValue').value.trim(), why = document.getElementById('editReason').value.trim() || 'no reason given';
    const step = DATA[id].steps[visibleSteps(id).length];
    if (step && step.correction && step.correction.field === p && step.correction.to === val) {
      (state.corrections[id] = state.corrections[id] || {})[p] = { by: ME, from: step.correction.from, reason: why };
      state.visible[id] = visibleSteps(id).length + 1; state.flash[id + ':edit'] = '';
    } else state.flash[id + ':edit'] = 'Prototype: the recalculation after a correction is simulated only in case-102 (line 2 unit price → 6.40). In the build, any correction creates a new revision and a new assessment.';
    state.editing = null; render();
  };
}

document.getElementById('navCases').onclick = () => { state.view = 'cases'; render(); };
document.getElementById('reqToggle').onchange = e => document.getElementById('app').classList.toggle('show-req', e.target.checked);
render();
</script>
</body>
</html>
